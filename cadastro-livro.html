<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Acervo Bibliográfico</title>
</head>
<body>
    <header>
        <h2>
            Cadastro de referência Bibliográfica
        </h2>

        <p>
            Cadastre os livros recomendados para as disciplinas.
        </p>
    </header>

    <main>
        <form action="/salvar-livro" method="post">
            <fieldset>
                <legend>
                    Informações da obra
                </legend>
                
                <p>
                    <label for="título">Título do Livro:</label>
                    <input type="text" id="name" name="título" required>
                </p>

                <p>
                    <label for="autor">Autor(es):</label>
                    <input type="text" id="autor" name="autor" required>
                </p>

                <p>
                    <label for="isbn">ISBN:</label>
                    <input type="text" id="isbn" name="isbn" 
                    pattern="\d{13}" placeholder="xxxxxxxxxxxxx" 
                    inputmode="numeric" required>
                </p>

                <p>
                    <label for="ano">Ano de publicação:</label>
                    <input type="number" id="ano" name="ano" 
                    placeholder="EX: 2023" required>
                </p>
            </fieldset>

            <fieldset>
                <legend>
                    Detalhes Acadêmicos
                </legend>

                <p>
                    <label for="curso-alvo">Curso Alvo:</label>
                    <select name="curso-alvo" id="curso-alvo" required>
                        <option value="" disabled selected>Selecione um curso...</option>
                        <option value="ES">Engenharia de Software</option>
                        <option value="ADS">Análise e Desenv. de Sistemas</option>
                        <option value="TC">Tronco Comum</option>
                    </select>
                </p>

                <p>
                    <label for="disciplina">Disciplina:</label>
                    <input type="text" id="disciplina" name="disciplina" required>
                </p>

                <p>
                    <label for="formato">
                        Formato:
                        <input type="radio" name="formato" value="fisico"
                        required> Fisico 
                        <input type="radio" name="formato" value="digital"
                        required> Digital 
                        <input type="radio" name="formato" value="ambos"
                        required> Ambos
                    </label>
                </p>
            </fieldset>

            <button type="submit">
                Salvar Livro
            </button>
        </form>
    </main>
</body>
</html>
